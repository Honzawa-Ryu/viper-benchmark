# ============================================================
# Experiment Configuration
# 0002_eval_pathology_fms_organ_probe
#
# VIPERデータセットの画像 + `organ`列(9クラス)を使い、VLMではない病理特化
# feature extractor(models.yml参照)の組織分類プローブ評価(linear probe /
# kNN、StratifiedKFold)を行う。
# ============================================================

# --- Fixed hyperparameters (do NOT sweep these; --model-key is the swept dim in run_slurm.sh) ---
seed: 42

# StratifiedKFoldの分割数。organのクラスごとの画像数が最少で約19枚
# (2026-09-18確認)なので、5分割より細かくすると1fold中のサンプル数が
# 過小になり評価が不安定になる。
n_splits: 5

# kNN分類のk。
knn_k: 5

# 埋め込み抽出時のバッチサイズ。419枚程度なので大きくする必要はない。
batch_size: 16

# UNI/CONCH/Virchow2/H-optimus-0の重みは data/ 配下に
# models--<org>--<name>/... というHF hubキャッシュと同じレイアウトで
# 配置済み(2026-09-19、別プロジェクトの既存キャッシュからコピー)。
# grace01は/workspace/andre01(重みの元の置き場)をマウントしておらず、
# ジョブから直接参照できないことが実機検証で判明したため、VIPERデータセット
# と同じdata/配下に置く方式に変更した。hf_cache_dirという設定キーは廃止し、
# dataset_dirをそのままHF_HUB_CACHEとして使う(experiment.py参照)。
